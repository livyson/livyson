name: Generate activity overview

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preserve existing output branch files
        run: |
          mkdir -p dist /tmp/output-preserve
          git fetch origin output:output || true
          if git show-ref --verify --quiet refs/heads/output; then
            git archive output | tar -x -C /tmp/output-preserve || true
            cp -a /tmp/output-preserve/. dist/ || true
          fi

      - name: Generate activity-overview.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: node scripts/generate-activity-overview.mjs

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
