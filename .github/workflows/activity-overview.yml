name: Generate activity overview

on:
  schedule:
    # A cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-activity-overview.mjs"
      - "scripts/generate-contribution-graph.mjs"
      - "scripts/generate-tech-distribution.mjs"
      - "data/tech-distribution-fallback.json"
      - ".github/workflows/activity-overview.yml"

permissions:
  contents: write

concurrency:
  group: output-branch-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate profile chart SVGs
        env:
          # Prefer a classic PAT with `repo` so private owned repos count in tech distribution.
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          node scripts/generate-activity-overview.mjs
          node scripts/generate-contribution-graph.mjs
          node scripts/generate-tech-distribution.mjs

      - name: Publish chart SVGs to output
        id: publish
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          git clone --depth 1 --branch output "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR" \
            || (
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR"
              cd "$TEMP_DIR"
              git checkout --orphan output
              git rm -rf . >/dev/null 2>&1 || true
            )

          cp dist/activity-overview.svg "$TEMP_DIR/activity-overview.svg"
          cp dist/contribution-graph.svg "$TEMP_DIR/contribution-graph.svg"
          cp dist/tech-distribution.svg "$TEMP_DIR/tech-distribution.svg"
          cd "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-overview.svg contribution-graph.svg tech-distribution.svg

          if git diff --cached --quiet; then
            echo "SVG content unchanged"
            SHA="$(git rev-parse HEAD)"
          else
            git commit -m "Update profile chart SVGs"
            git push -u origin HEAD:output
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point README at commit SHA (bypasses raw.githubusercontent CDN)
        run: |
          set -euo pipefail
          SHA="${{ steps.publish.outputs.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          sha = os.environ["SHA"]
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "activity-overview.svg": re.compile(
                  r"https://raw\.githubusercontent\.com/livyson/livyson/(?:output|[0-9a-f]{7,40})/activity-overview\.svg(?:\?[^\"'\s]*)?"
              ),
              "contribution-graph.svg": re.compile(
                  r"https://(?:raw\.githubusercontent\.com/livyson/livyson/(?:output|[0-9a-f]{7,40})/contribution-graph\.svg(?:\?[^\"'\s]*)?|github-readme-activity-graph\.vercel\.app/graph\?[^\"]+)"
              ),
              "tech-distribution.svg": re.compile(
                  r"https://raw\.githubusercontent\.com/livyson/livyson/(?:output|[0-9a-f]{7,40})/tech-distribution\.svg(?:\?[^\"'\s]*)?"
              ),
          }
          updated = text
          for filename, pattern in replacements.items():
              url = f"https://raw.githubusercontent.com/livyson/livyson/{sha}/{filename}"
              updated, count = pattern.subn(url, updated)
              if count == 0:
                  raise SystemExit(f"{filename} URL not found in README.md")
              print(f"README {filename} -> {sha} ({count} match)")
          if updated == text:
              print(f"README already points to {sha}")
          else:
              path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "chore: refresh profile chart cache [skip ci]"
          git pull --rebase origin main
          git push
        env:
          SHA: ${{ steps.publish.outputs.sha }}
