name: Generate activity overview

on:
  schedule:
    # A cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-activity-overview.mjs"
      - ".github/workflows/activity-overview.yml"

permissions:
  contents: write

concurrency:
  group: output-branch-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate activity-overview.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          node scripts/generate-activity-overview.mjs

      - name: Publish activity-overview.svg to output
        id: publish
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          git clone --depth 1 --branch output "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR" \
            || (
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR"
              cd "$TEMP_DIR"
              git checkout --orphan output
              git rm -rf . >/dev/null 2>&1 || true
            )

          cp dist/activity-overview.svg "$TEMP_DIR/activity-overview.svg"
          cd "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-overview.svg

          if git diff --cached --quiet; then
            echo "SVG content unchanged"
            SHA="$(git rev-parse HEAD)"
          else
            git commit -m "Update activity-overview.svg"
            git push -u origin HEAD:output
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point README at commit SHA (bypasses raw.githubusercontent CDN)
        run: |
          set -euo pipefail
          SHA="${{ steps.publish.outputs.sha }}"
          # raw.githubusercontent.com cacheia por path e IGNORA ?v= —
          # usar o SHA do commit muda o path e força conteúdo novo.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          sha = os.environ["SHA"]
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"https://raw\.githubusercontent\.com/livyson/livyson/(?:output|[0-9a-f]{7,40})/activity-overview\.svg(?:\?[^\"'\s]*)?"
          )
          replacement = f"https://raw.githubusercontent.com/livyson/livyson/{sha}/activity-overview.svg"
          updated, count = pattern.subn(replacement, text)
          if count == 0:
              raise SystemExit("activity-overview.svg URL not found in README.md")
          if updated == text:
              print(f"README already points to {sha}")
          else:
              path.write_text(updated, encoding="utf-8")
              print(f"README image URL set to commit {sha}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "chore: refresh activity overview cache [skip ci]"
          git push
        env:
          SHA: ${{ steps.publish.outputs.sha }}
