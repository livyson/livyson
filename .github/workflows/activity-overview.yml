name: Generate activity overview

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: output-branch-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate activity-overview.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          node scripts/generate-activity-overview.mjs

      - name: Publish only activity-overview.svg to output
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          git clone --depth 1 --branch output "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR" \
            || (
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR"
              cd "$TEMP_DIR"
              git checkout --orphan output
              git rm -rf . >/dev/null 2>&1 || true
            )

          cp dist/activity-overview.svg "$TEMP_DIR/activity-overview.svg"
          cd "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-overview.svg
          if git diff --cached --quiet; then
            echo "No changes to activity-overview.svg"
            exit 0
          fi
          git commit -m "Update activity-overview.svg"
          git push -u origin HEAD:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
