name: Generate pacman animation

on:
  schedule:
    # executa a cada 12 horas (meia-noite e meio-dia UTC)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: output-branch-assets
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Publish pacman SVGs to output without wiping other assets
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          git clone --depth 1 --branch output "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR" \
            || (
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR"
              cd "$TEMP_DIR"
              git checkout --orphan output
              git rm -rf . >/dev/null 2>&1 || true
            )

          if [ -d dist ]; then
            find dist -maxdepth 1 -type f -name '*.svg' ! -name 'activity-overview.svg' -exec cp {} "$TEMP_DIR"/ \;
          fi

          cd "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg || true
          if git diff --cached --quiet; then
            echo "No pacman svg changes"
            exit 0
          fi
          git commit -m "Update pacman contribution graphs"
          git push -u origin HEAD:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
