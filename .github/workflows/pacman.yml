name: Generate pacman animation

on:
  schedule:
    # executa a cada 12 horas (meia-noite e meio-dia UTC)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: output-branch-assets
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Keep contribution cells permanently visible
        run: node scripts/keep-pacman-contributions.mjs

      - name: Publish pacman SVGs to output without wiping other assets
        id: publish
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          git clone --depth 1 --branch output "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR" \
            || (
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TEMP_DIR"
              cd "$TEMP_DIR"
              git checkout --orphan output
              git rm -rf . >/dev/null 2>&1 || true
            )

          if [ -d dist ]; then
            find dist -maxdepth 1 -type f -name '*.svg' \
              ! -name 'activity-overview.svg' \
              ! -name 'contribution-graph.svg' \
              -exec cp {} "$TEMP_DIR"/ \;
          fi

          cd "$TEMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg || true
          if git diff --cached --quiet; then
            echo "No pacman svg changes"
            SHA="$(git rev-parse HEAD)"
          else
            git commit -m "Update pacman contribution graphs"
            git push -u origin HEAD:output
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point README Pac-Man images at commit SHA
        run: |
          set -euo pipefail
          SHA="${{ steps.publish.outputs.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          sha = os.environ["SHA"]
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          updated = text
          for filename in (
              "pacman-contribution-graph.svg",
              "pacman-contribution-graph-dark.svg",
          ):
              pattern = re.compile(
                  rf"https://raw\.githubusercontent\.com/livyson/livyson/(?:output|[0-9a-f]{{7,40}})/{re.escape(filename)}(?:\?[^\"'\s]*)?"
              )
              url = f"https://raw.githubusercontent.com/livyson/livyson/{sha}/{filename}"
              updated, count = pattern.subn(url, updated)
              if count == 0:
                  raise SystemExit(f"{filename} URL not found in README.md")
              print(f"README {filename} -> {sha} ({count} match)")
          if updated != text:
              path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "chore: refresh pacman graph cache [skip ci]"
          git push
        env:
          SHA: ${{ steps.publish.outputs.sha }}
